# Declares (a) which weather facts exist and how each is computed from Open-Meteo hourly data,
# and (b) the named time windows a user can ask about.
# SOP conditions may reference any field below. Adding a field here is config-only.
fields:
  temp_c:          {var: temperature_2m,          agg: max, label: "Peak temperature (°C)"}
  temp_min_c:      {var: temperature_2m,          agg: min, label: "Lowest temperature (°C)"}
  feels_like_c:    {var: apparent_temperature,    agg: max, label: "Peak feels-like temperature (°C)"}
  humidity_pct:    {var: relative_humidity_2m,    agg: max, label: "Peak humidity (%)"}
  wind_kmh:        {var: wind_speed_10m,          agg: max, label: "Peak wind speed (km/h)"}
  gust_kmh:        {var: wind_gusts_10m,          agg: max, label: "Peak wind gusts (km/h)"}
  precip_prob_pct: {var: precipitation_probability, agg: max, label: "Peak rain probability (%)"}
  precip_mm:       {var: precipitation,           agg: sum, label: "Rain in the window (mm)"}
  precip_mm_day:   {var: precipitation,           agg: sum, scope: day, label: "Rain over the whole day (mm)"}
  uv_index:        {var: uv_index,                agg: max, label: "Peak UV index"}
  uv_midday:       {var: uv_index,                agg: max, hours: [11, 16], label: "Peak UV index, 11:00-16:00"}
  weather_code:    {var: weather_code,            agg: max, label: "Worst WMO weather code"}
  visibility_m:    {var: visibility,              agg: min, label: "Lowest visibility (m)"}

windows:               # start/end are local hours; "now" = current hour
  now:            {day_offset: 0, start: now, end: now}
  today:          {day_offset: 0, start: now, end: 23}
  this_morning:   {day_offset: 0, start: 5,   end: 10}
  this_afternoon: {day_offset: 0, start: 12,  end: 16}
  this_evening:   {day_offset: 0, start: 17,  end: 21}
  tonight:        {day_offset: 0, start: 21,  end: 23}
  tomorrow:       {day_offset: 1, start: 6,   end: 22}
  tomorrow_morning:   {day_offset: 1, start: 5,  end: 10}
  tomorrow_afternoon: {day_offset: 1, start: 12, end: 16}
  tomorrow_evening:   {day_offset: 1, start: 17, end: 21}
